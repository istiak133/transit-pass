name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR cancels the stale run instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: >
          dotnet test --no-build -c Release
          --coverage --coverage-output-format cobertura
          --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Builds every image the way production would, so a broken Dockerfile or a project that only
      # compiles with local state fails here instead of at deploy time.
      - name: Build images
        run: |
          ./deploy/dev-secrets.sh
          docker compose build

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The deploy scripts (demo.sh, fake-payment.sh, gate-tap.sh, dev-secrets.sh) are part of the product:
      # a syntax error or an unquoted variable there breaks the 2-minute demo. Parse each one, then lint it
      # (shellcheck ships with the GitHub Ubuntu runner).
      - name: Syntax check
        run: |
          bash -n deploy/demo.sh
          for f in deploy/dev-secrets.sh deploy/fake-payment.sh deploy/gate-tap.sh deploy/postgres/init.sh; do sh -n "$f"; done

      - name: shellcheck
        run: shellcheck deploy/*.sh deploy/postgres/*.sh

      # No stack runs in CI, so this checks the other half of "fails loudly": with nothing listening, demo.sh must
      # wait briefly, then exit 1 with "not ready" (and never print "Demo passed").
      - name: demo.sh fails loudly without a stack
        run: |
          ./deploy/dev-secrets.sh
          if out=$(GATEWAY_URL=http://127.0.0.1:9 WAIT_SECONDS=2 ./deploy/demo.sh 2>&1); then
            echo "$out"; echo "demo.sh passed with no stack running"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "not ready"
          ! echo "$out" | grep -q "Demo passed"

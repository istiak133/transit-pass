name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - run: dotnet build -c Release

      # Analyse, but upload only after removing results in generated files (obj/): compiled languages ignore
      # paths-ignore during extraction, so the filter is what keeps the alert list to real code.
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: sarif-results

      - name: Drop results in generated files (obj/)
        run: |
          for f in sarif-results/*.sarif; do
            jq '.runs |= map(.results |= map(select(
                  ([.locations[]?.physicalLocation.artifactLocation.uri // ""]
                   | any(test("(^|/)obj/"))) | not)))' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
            echo "$f: $(jq '[.runs[].results | length] | add' "$f") results kept"
          done

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results
